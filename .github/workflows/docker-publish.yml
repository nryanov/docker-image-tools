# Build and push multi-arch (linux/amd64, linux/arm64) images to Docker Hub.
#
# Image layout: one Docker Hub repository per top-level directory that contains
# a Dockerfile, named nryanov/tools-<dirname> (e.g. nryanov/tools-hive).

name: Docker Hub publish

on:
  push:
    branches: [main]
    paths:
      - "*/Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=()
          for d in */; do
            name="${d%/}"
            [[ "$name" == .* ]] && continue
            [[ -f "$name/Dockerfile" ]] || continue
            images+=("$name")
          done
          if [[ ${#images[@]} -eq 0 ]]; then
            echo 'images=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json=$(printf '%s\n' "${images[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "images=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          file: ./${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nryanov/tools-${{ matrix.image }}:latest
            nryanov/tools-${{ matrix.image }}:sha-${{ github.sha }}
